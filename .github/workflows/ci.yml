name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Typen und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nur für den Testlauf: Dev-Login an, Zufalls-Secret, keine echten Zugangsdaten
      DEV_LOGIN: "true"
      AUTH_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
